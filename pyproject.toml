[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swf2hab"
version = "0.4.0"
description = "Convert Habbo Flash asset libraries (.swf) and Nitro bundles (.nitro) to Habbo HTML5 .hab bundles, and back"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
fast = ["numpy", "Pillow"]

[project.scripts]
swf2hab = "swf2hab.cli:main"

[tool.setuptools]
packages = ["swf2hab"]
